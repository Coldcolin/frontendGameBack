# Render Blueprint for this repo (the frontend deploys separately to Vercel).
services:
  - type: web
    name: diffarena-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string
      - key: WEB_ORIGIN
        sync: false # e.g. https://diffarena.vercel.app (comma-separate several)
      - key: WEB_ORIGIN_PATTERN
        sync: false # optional regex for Vercel previews
      - key: TRUST_PROXY
        value: "1" # Render's proxy, so rate limits see the real client IP
      - key: MAX_RENDER_PAGES
        value: "1" # 512 MB free instance; raise on bigger plans
